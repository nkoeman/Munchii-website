server {
  listen 80;
  server_name www.munchii.app;
  return 301 https://munchii.app$request_uri;
}

server {
  listen 80 default_server;
  server_name munchii.app localhost _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  location ~* \.(?:css|svg|xml|txt|png|jpg|jpeg|webp|ico)$ {
    try_files $uri =404;
    expires 1h;
    add_header Cache-Control "public";
  }
}
